<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 60 380 212" fill="none" role="presentation" aria-hidden="true">
  <!--
    Login backdrop — the desk. SCR-001 and SCR-010 only.

    Geometry ONLY. No colour and no page ground live in this file:
      · stroke is `currentColor`, so the caller sets it from a token
        (`--c-illustration-line`) and both themes work without a second file
      · the page supplies `--c-surface` behind it; the supplied artwork's
        background rect was exactly that token and has been removed rather than
        duplicated, so the ground can never disagree with the page

    One file serves all three breakpoints. The three supplied SVGs carried
    byte-identical path data and differed only in scale and hand-tuned stroke
    width; `vector-effect="non-scaling-stroke"` holds the line at ~1.3px / ~1px
    at every size, which is what those stroke widths were compensating for.

    Placement, opacity and the clearance rule: inception/design/wireframe-rules.md
  -->
